name: Proposition d'exigence
description: Soumettre une exigence rédigée pour consultation avant intégration à spec/
title: "[Spec] "
labels: [à-discuter]
body:
  - type: textarea
    id: exigence
    attributes:
      label: Exigence proposée
      description: Formulation EARS avec niveau normatif et critères d'acceptation (modèle templates/fr/requirement.md).
    validations:
      required: true
  - type: input
    id: besoin-parent
    attributes:
      label: Besoin parent
      placeholder: feat~exemple~1
    validations:
      required: true
  - type: dropdown
    id: enjeu
    attributes:
      label: Niveau d'enjeu
      options:
        - S — structurant (séance requise)
        - F — fonctionnel (consultation asynchrone)
        - É — éditorial (simple PR)
    validations:
      required: true
