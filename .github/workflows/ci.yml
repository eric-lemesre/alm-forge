# [impl->req~porte-ci~1]
# La CI rejoue exactement les portes locales : même script, même périmètre
# (tools/oft.sh et tools/checks.sh sont le point unique de vérité, R7).
# Actions épinglées par SHA de commit (chaîne d'approvisionnement).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : lecture seule — aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  portes:
    name: Traçabilité et cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pas de token laissé dans la copie de travail après le checkout.
          persist-credentials: false
          # Historique complet : la porte anti-secrets balaie tout l'historique.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Traçabilité (OpenFastTrace)
        run: tools/oft.sh trace

      - name: Contrôles de cohérence
        run: tools/checks.sh

      - name: Porte anti-secrets (gitleaks)
        run: tools/secrets.sh scan

      - name: Test de la porte anti-secrets
        run: tools/secrets-test.sh

      - name: Test du script d'instanciation
        run: tools/init-test.sh

      - name: Test du parcours d'accueil
        run: tools/setup-test.sh

      - name: Test du nettoyage
        run: tools/clean-test.sh

      - name: Rapport HTML de traçabilité
        if: always()
        run: tools/oft.sh report

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rapport-tracabilite
          path: build/tracabilite.html
