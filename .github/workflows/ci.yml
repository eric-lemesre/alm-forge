# [impl->req~porte-ci~1]
# La CI rejoue exactement les portes locales : elle délègue à tools/ci.sh,
# point unique de vérité des étapes (R7, ADR-0010). Aucune étape ne se
# déclare ici : ce qui tourne en CI est ce qui tourne sur le poste.
# Actions épinglées par SHA de commit (chaîne d'approvisionnement).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : lecture seule — aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  portes:
    name: Traçabilité et cohérence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pas de token laissé dans la copie de travail après le checkout.
          persist-credentials: false
          # Historique complet : la porte anti-secrets balaie tout l'historique.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Point d'entrée UNIQUE : la CI n'a pas sa propre liste d'étapes.
      # tools/ci.sh constate le périmètre et emprunte la voie qui convient
      # (ADR-0017) ; l'historique complet du checkout ci-dessus lui donne la
      # base de fusion sans laquelle il retomberait toujours en voie complète.
      - name: Portes
        run: tools/ci.sh

      - name: Rapport HTML de traçabilité
        if: always()
        run: tools/oft.sh report

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: rapport-tracabilite
          path: build/tracabilite.html
